apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-workload-sa
  namespace: prod
automountServiceAccountToken: false
---
# ==========================================
# 1. Node.js API
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
  namespace: prod
  labels:
    app: node-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: node-api
    spec:
      serviceAccountName: api-workload-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node-api
          image: localhost:5001/node-api:1.0.1
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: node-api
  namespace: prod
spec:
  selector:
    app: node-api
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: node-api-pdb
  namespace: prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: node-api
---
