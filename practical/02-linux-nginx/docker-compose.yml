services:
  prod-api:
    build:
      context: ../01-production-docker/node-api
    image: node-api:1.0.0
    container_name: prod-api
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: prod-nginx
    depends_on:
      - prod-api
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
