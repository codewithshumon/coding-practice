ingress:
  enabled: true
  className: nginx
  host: api.localtest.me
  tlsSecretName: api-tls-secret
  limitRps: "10"

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

services:
  node-api:
    image: localhost:5001/node-api
    tag: "1.0.1"
    port: 3000
    path: /node
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  python-api:
    image: localhost:5001/python-api
    tag: "1.0.1"
    port: 5000
    path: /python
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  go-api:
    image: localhost:5001/go-api
    tag: "1.0.0"
    port: 8080
    path: /go
    replicas: 2
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
