ingress:
  host: api.localtest.me
  tlsSecretName: api-tls-secret
  limitRps: "10"

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

services:
  node-api:
    replicas: 2
  python-api:
    replicas: 2
  go-api:
    replicas: 2
