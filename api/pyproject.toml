[project]
name = "flask-learning-api"
version = "0.1.0"
description = "Production-grade Flask REST API — learning lab"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "pydantic[email]>=2.5",
    "flask-pydantic>=0.12",
    "flask-bcrypt>=1.0",
    "flask-socketio>=5.3",
    "flasgger>=0.9",
    "flask-migrate>=4.0",
    "flask-cors>=5.0",
    "flask-talisman>=1.1",
    "flask-limiter>=3.5",
    "gunicorn>=22.0",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
